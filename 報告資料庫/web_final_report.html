<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Final - 翁榆涵</title>
    <style>
        /* 讓網頁背景乾淨一點 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* 淺灰色背景 */
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 標題區塊樣式 */
        header {
            margin-top: 20px;
            text-align: center;
            color: #333;
        }

        /* 簡報容器：設定最大寬度，讓它在大螢幕上不要太寬 */
        .presentation-wrapper {
            width: 90%;
            max-width: 1000px; /* 限制最大寬度 */
            margin: 20px auto;
        }

        /* 頁尾 */
        footer {
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        a {
            color: #008ba3;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>期末網頁簡報</h1>
    </header>

    <div class="presentation-wrapper">
        <div style="position: relative; width: 100%; height: 0; padding-top: 56.2500%;
        padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
        border-radius: 8px; will-change: transform;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
            src="https://www.canva.com/design/DAG6_0HkYQ8/uoUwrxUhQ6WSz5wGmuDB3Q/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
    </div>

    <footer>
        設計者：翁榆涵 | <a href="https://www.canva.com/design/DAG6_0HkYQ8/uoUwrxUhQ6WSz5wGmuDB3Q/view?utm_content=DAG6_0HkYQ8&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">在 Canva 開啟原始檔</a>
    </footer>

</body>
</html>
